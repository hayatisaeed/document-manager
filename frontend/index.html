<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='3' fill='%233b6ea8'/%3E%3Cpath d='M11 10h10M11 15h10M11 20h6' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Document Manager</title>
    <script>
      // Apply saved theme and language before the first paint (no flash).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("dm:prefs") || "{}");
          var dark = p.theme === "dark" || ((!p.theme || p.theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (p.lang === "fa") { document.documentElement.lang = "fa"; document.documentElement.dir = "rtl"; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
